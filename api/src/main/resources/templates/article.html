<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${article.title}, ${article.description}, ~{::content})}">
<body>
<div th:fragment="content" class="container">
  <aside class="disclosure" role="note" th:text="${disclosure}"></aside>
  <p class="breadcrumb"><a href="/">홈</a> › <a th:href="@{/{b}(b=${article.brandSlug})}" th:text="${article.brandName}">브랜드</a></p>
  <article>
    <h1 th:text="${article.title}">제목</h1>
    <p class="meta" th:text="'업데이트 ' + ${#temporals.format(article.updatedAt, 'yyyy.MM.dd')}">업데이트</p>
    <div class="body" th:utext="${article.bodyHtml}"></div>
  </article>
</div>
</body>
</html>
