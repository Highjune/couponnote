<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, description, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | 쿠폰노트'">쿠폰노트</title>
  <meta name="description" th:content="${description}">
  <link rel="canonical" th:href="${siteUrl} + ${canonical}">
  <meta property="og:type" content="website">
  <meta property="og:title" th:content="${title}">
  <meta property="og:description" th:content="${description}">
  <meta property="og:url" th:content="${siteUrl} + ${canonical}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">쿠폰노트</a>
    <nav><a href="/myrealtrip">마이리얼트립</a></nav>
  </header>

  <main class="container">
    <aside class="disclosure" role="note" th:text="${disclosure}"></aside>
    <div th:replace="${content}"></div>
  </main>

  <footer class="site-footer">
    <p>쿠폰노트 · 할인코드와 쿠폰을 매달 정리합니다. 쿠폰은 플랫폼 정책에 따라 예고 없이 변경될 수 있습니다.</p>
  </footer>
</body>
</html>
